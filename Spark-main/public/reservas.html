
    <!DOCTYPE html>
    <html lang="pt-BR">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>Fazer Reserva - ReservaEdu</title>

        <style>

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Arial, Helvetica, sans-serif;
                background: #f3f6fa;
                color: #1e293b;
            }

            header {
                background: #075985;
                color: white;
                padding: 20px 40px;
            }

            header h1 {
                font-size: 28px;
            }

            header p {
                margin-top: 5px;
                opacity: 0.9;
            }

            .container {
                width: 90%;
                max-width: 700px;
                margin: 40px auto;
            }

            .card {
                background: white;
                padding: 30px;
                border-radius: 16px;

                box-shadow:
                    0 8px 25px rgba(0, 0, 0, 0.08);
            }

            h2 {
                color: #075985;
                margin-bottom: 25px;
            }

            label {
                display: block;
                margin-bottom: 7px;
                font-weight: bold;
            }

            input,
            select {
                width: 100%;
                padding: 13px;
                margin-bottom: 20px;

                border: 1px solid #cbd5e1;
                border-radius: 8px;

                font-size: 16px;
            }

            input:focus,
            select:focus {
                outline: none;
                border-color: #16a34a;
            }

            button {
                width: 100%;
                padding: 14px;

                border: none;
                border-radius: 8px;

                background: #16a34a;
                color: white;

                font-size: 16px;
                font-weight: bold;

                cursor: pointer;
            }

            button:hover {
                background: #15803d;
            }

            .voltar {
                display: inline-block;
                margin-top: 20px;

                color: #075985;
                text-decoration: none;
                font-weight: bold;
            }

            .mensagem {
                display: none;

                margin-bottom: 20px;
                padding: 15px;

                border-radius: 8px;

                background: #dcfce7;
                color: #166534;
            }

        </style>

    </head>

    <body>

        <header>

            <h1>ReservaEdu</h1>

            <p>Reserva de Equipamentos Pedagógicos</p>

        </header>


        <div class="container">

            <div class="card">

                <h2>📅 Fazer uma reserva</h2>

                <div id="mensagem"
                     class="mensagem">
                </div>


                <form id="formReserva">

                    <label for="nome">
                        Nome do aluno
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >


                    <label for="matricula">
                        Matrícula
                    </label>

                    <input
                        type="text"
                        id="matricula"
                        placeholder="Digite sua matrícula"
                        required
                    >


                    <label for="equipamento">
                        Equipamento
                    </label>

                    <select
                        id="equipamento"
                        required
                    >

                        <option value="">
                            Carregando equipamentos...
                        </option>

                    </select>


                    <label for="data">
                        Data da reserva
                    </label>

                    <input
                        type="date"
                        id="data"
                        required
                    >


                   <label for="hora_retirada">Horário de retirada</label>
<input type="time" id="hora_retirada" required>

<label for="hora_devolucao">Horário de devolução</label>
<input type="time" id="hora_devolucao" required>

                    <button type="submit">
                        Confirmar reserva
                    </button>

                </form>


                <a href="/" class="voltar">
                    ← Voltar para a página inicial
                </a>

            </div>

        </div>


        <script>

            // =========================
            // CARREGAR EQUIPAMENTOS
            // =========================

            async function carregarEquipamentos() {

                const select =
                    document.getElementById("equipamento");

                try {

                    const resposta =
                        await fetch("/equipamentos");

                    const equipamentos =
                        await resposta.json();

                    select.innerHTML =
                        '<option value="">Selecione um equipamento</option>';

                    equipamentos.forEach(equipamento => {

                        const option =
                            document.createElement("option");

                        option.value =
                            equipamento.nome;

                        option.textContent =
                            equipamento.nome +
                            " - " +
                            equipamento.quantidade +
                            " disponível(is)";

                        select.appendChild(option);

                    });

                } catch (erro) {

                    select.innerHTML =
                        '<option value="">Erro ao carregar equipamentos</option>';

                }

            }


            // =========================
            // ENVIAR RESERVA
            // =========================

            document
                .getElementById("formReserva")
                .addEventListener("submit", async function(event) {

                    event.preventDefault();

                    const dados = {

    nome_aluno:
        document.getElementById("nome").value,

    matricula:
        document.getElementById("matricula").value,

    equipamento:
        document.getElementById("equipamento").value,

    data:
        document.getElementById("data").value,

    hora_retirada:
        document.getElementById("hora_retirada").value,

    hora_devolucao:
        document.getElementById("hora_devolucao").value

};

                    try {

                        const resposta =
                            await fetch("/reservas", {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(dados)

                            });


                        const resultado =
                            await resposta.json();


                        const mensagem =
                            document.getElementById("mensagem");


                        if (resposta.ok) {

                            mensagem.style.display = "block";

                            mensagem.textContent =
                                "✅ " +
                                resultado.mensagem;

                            document
                                .getElementById("formReserva")
                                .reset();

                        } else {

                            mensagem.style.display = "block";

                            mensagem.textContent =
                                "❌ " + (resultado.erro || "Não foi possível realizar a reserva.");

                        }

                    } catch (erro) {

                        alert(
                            "Erro ao conectar com o servidor."
                        );

                    }

                });


            // Carregar equipamentos
            carregarEquipamentos();

        </script>

    </body>

    </html>
